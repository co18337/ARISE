name: the_system
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Required explicitly since flutter_local_notifications 22 declares web
  # support: Flutter then generates a web_plugin_registrant that imports this,
  # and without it the WEB build fails to resolve the package even though the
  # app never posts a notification in a browser.
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Already in the tree via drift_flutter; named here because the JSON backup
  # imports it directly, and depending on a transitive package by accident is
  # how a build breaks on someone else's machine.
  path_provider: ^2.1.5
  # Renders the bundled game-icons.net SVGs. Pure Dart (no native code), so it
  # cannot drag in the platform build problems google_fonts did.
  flutter_svg: ^2.0.10
  # Reads the gitignored assets/config/.env at runtime, so the Gemini key can
  # be dropped in without rebuilding or editing any Dart.
  flutter_dotenv: ^5.1.0
  # The Gemini REST call. Pure Dart, no platform channels.
  http: ^1.2.0
  # Stable hashing for the model-response cache key. Dart's own hashCode
  # carries no cross-run stability guarantee, and a cache that silently stops
  # matching after an SDK upgrade is very hard to diagnose.
  crypto: ^3.0.3
  # Charts for PROGRESS. Pure Dart on a Canvas — no WebView, no bundled
  # JavaScript, nothing fetched at runtime, so the charts work with the radio
  # off like the rest of the app. Apache ECharts was the other candidate and is
  # the better library in the abstract, but it renders inside a WebView: a
  # second rendering engine with its own fonts and its own idea of a colour
  # scheme, which would look like a web page pasted into the HUD.
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # Health Connect on Android. READ-ONLY and one-way: the System reads steps,
  # sleep and heart rate, and never writes anything back. Health Connect is the
  # system-level store other apps sync into, so this picks up the phone's own
  # step counter without asking for a second account anywhere.
  health: ^13.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Emblem and stat artwork. SVG, single-path, white-on-transparent, so one
  # file recolours to any rank or stat tier at runtime.
  # Source + licence: see assets/icons/CREDITS.md (CC BY 3.0 — attribution is
  # required and is shown in-app on the BACKUP screen).
  assets:
    - assets/icons/
    - assets/badges/
    # A DIRECTORY, not a file: `.env` is gitignored and may not exist on a
    # fresh clone, and Flutter fails the build on a missing named asset but
    # not on a directory that happens to be missing one.
    - assets/config/
    # Exercise demonstration animations. Mostly empty for now — see the README
    # in there; each exercise falls back to its written cue without one.
    - assets/exercises/
    # The summoning animation. Gitignored (anime footage, local use only), so
    # it may simply be absent on a fresh clone — SummonGate falls back.
    - assets/solo-leveling-arise.gif

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The font files are BUNDLED in assets/fonts/ rather than downloaded at
  # runtime by the google_fonts package, because the app must work fully
  # offline (see CLAUDE.md). Declaring them here is all Flutter needs — refer
  # to them by family name in TextStyle, and Flutter picks the file matching
  # the requested fontWeight.
  #
  # Orbitron       = angular techno headings
  # Rajdhani       = HUD labels/readouts
  # Inter          = body text
  # ShareTechMono  = counters and numeric readouts (amber), see DESIGN.md
  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
          weight: 400
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-Black.ttf
          weight: 900
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icon generation. A DEV tool: it writes the mipmap PNGs and the
# adaptive-icon XML into android/app/src/main/res once, and takes no part in
# the build afterwards. Regenerate with:
#   dart run flutter_launcher_icons
#
# The source crest is Prince's own artwork (assets/icon/source_crest.png). The
# foreground is cropped out of it — the outer neon frame is dropped because a
# rounded square inside Android's own squircle mask reads as a mistake, and the
# "S-RANK LEVEL UP" lettering is dropped because it is illegible at 48dp.
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # The app's own background colour, so the icon and the app agree.
  adaptive_icon_background: "#05070D"
  min_sdk_android: 21
  remove_alpha_ios: true
